name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate tag matches package.json version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compare tag version to package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version:  $TAG_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($GITHUB_REF_NAME) does not match package.json version ($PKG_VERSION). Bump package.json before tagging."
            exit 1
          fi

  build:
    name: Build & publish (${{ matrix.name }})
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64), GitHub-hosted.
        # Intel (x64) macOS builds run on a self-hosted runner (see
        # docs/build.md → "Intel Mac runner") because GitHub removed free
        # Intel macOS hosted images (macos-13 is deprecated) and only offers
        # x64 macOS via paid Larger runners.
        include:
          - name: windows
            runs-on: windows-latest
          - name: linux
            runs-on: ubuntu-latest
          - name: macos-arm64
            runs-on: macos-latest
          - name: macos-intel
            runs-on: [self-hosted, macOS, X64]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
